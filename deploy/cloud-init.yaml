#cloud-config
#
# Provisions a Dokku host for the gritz server, with Postgres running as a
# container on the same droplet.
#
# Create the droplet with `mise run droplet:create`, or directly:
#
#   doctl compute droplet create gritz \
#     --region tor1 --size s-2vcpu-4gb --image ubuntu-24-04-x64 \
#     --ssh-keys <fingerprint> --user-data-file deploy/cloud-init.yaml --wait
#
# This file is committed to the repo and MUST NOT contain secrets.
#
# It takes the host as far as "empty app, waiting for its first deploy".
# Secrets, the domain, TLS and the first image deploy are deliberately left to
# step 2 of deploy/README.md: they need credentials that cannot live here, and
# Let's Encrypt in particular cannot run until DNS already points at the
# droplet, which is not true at first boot.

hostname: gritz

package_update: true
package_upgrade: true

packages:
  - ca-certificates
  - curl
  - ufw

write_files:
  # cloud-init writes files before it installs packages, so every apt
  # invocation below - including the ones inside Dokku's installer - inherits
  # this. Without it a concurrent unattended-upgrades run makes the install
  # fail on a held dpkg lock instead of waiting for it.
  - path: /etc/apt/apt.conf.d/99-lock-timeout
    permissions: '0644'
    content: |
      DPkg::Lock::Timeout "300";
      Acquire::Retries "3";

  - path: /usr/local/sbin/gritz-bootstrap
    permissions: '0755'
    content: |
      #!/usr/bin/env bash
      set -euo pipefail

      exec > >(tee -a /var/log/gritz-bootstrap.log) 2>&1
      echo "=== gritz bootstrap starting $(date -Is) ==="

      # cloud-init runs runcmd with a minimal environment that has no HOME, and
      # git refuses to run without one ("fatal: $HOME not set"), which takes
      # every `dokku plugin:install` down with it.
      export HOME=/root
      export DEBIAN_FRONTEND=noninteractive

      DOKKU_VERSION=v0.38.27
      POSTGRES_PLUGIN_VERSION=1.48.0
      LETSENCRYPT_PLUGIN_VERSION=0.25.2
      APP=gritz
      POSTGRES_SERVICE=gritz-db

      # Every step below is guarded so this script can be re-run to resume a
      # partial bootstrap in place, rather than needing the droplet rebuilt.

      # 4G of RAM is comfortable for the server plus Postgres, but image pulls
      # and autovacuum spikes are cheaper to absorb in swap than to OOM.
      if [ ! -e /swapfile ]; then
        fallocate -l 2G /swapfile
        chmod 600 /swapfile
        mkswap /swapfile
        swapon /swapfile
        echo '/swapfile none swap sw 0 0' >>/etc/fstab
        echo 'vm.swappiness=10' >/etc/sysctl.d/99-gritz-swappiness.conf
        sysctl -p /etc/sysctl.d/99-gritz-swappiness.conf
      fi

      # Order matters: allow ssh before enabling, or this locks us out of the
      # droplet. Dokku terminates 80/443 with nginx on the host, so ufw governs
      # them - unlike published docker ports, which bypass ufw entirely via the
      # DOCKER iptables chain.
      ufw allow 22/tcp
      ufw allow 80/tcp
      ufw allow 443/tcp
      ufw --force enable

      # Pinned, versioned installer URL. Also installs docker.
      if ! command -v dokku >/dev/null 2>&1; then
        curl -fsSL "https://dokku.com/install/${DOKKU_VERSION}/bootstrap.sh" \
          -o /tmp/dokku-bootstrap.sh
        DOKKU_TAG="${DOKKU_VERSION}" bash /tmp/dokku-bootstrap.sh
      fi

      # Authorize whichever keys DigitalOcean injected into root for `dokku`
      # over ssh. ssh-keys:add takes one key at a time, hence the loop.
      n=0
      while read -r key; do
        [ -n "${key}" ] || continue
        case "${key}" in \#*) continue ;; esac
        n=$((n + 1))
        if ! dokku ssh-keys:list 2>/dev/null | grep -q "NAME=\"admin-${n}\""; then
          printf '%s\n' "${key}" | dokku ssh-keys:add "admin-${n}"
        fi
      done </root/.ssh/authorized_keys

      # Pin the plugins: dokku-postgres takes its Postgres version from its own
      # checkout, so tracking master would silently move the database version
      # on any later rebuild of this host. 1.48.0 ships postgres 18.4, which
      # matches docker-compose.yml.
      install_plugin() {
        local name=$1 url=$2 version=$3
        if ! dokku plugin:list | awk '{print $1}' | grep -qx "${name}"; then
          dokku plugin:install "${url}" --committish "${version}" --name "${name}"
        fi
      }
      install_plugin postgres \
        https://github.com/dokku/dokku-postgres.git "${POSTGRES_PLUGIN_VERSION}"
      install_plugin letsencrypt \
        https://github.com/dokku/dokku-letsencrypt.git "${LETSENCRYPT_PLUGIN_VERSION}"

      dokku apps:exists "${APP}" 2>/dev/null || dokku apps:create "${APP}"

      # Postgres is a container on this same droplet; its data lives on the
      # droplet disk under /var/lib/dokku/services/postgres/${POSTGRES_SERVICE}.
      dokku postgres:exists "${POSTGRES_SERVICE}" 2>/dev/null \
        || dokku postgres:create "${POSTGRES_SERVICE}"

      # The server reads GRITZ_DATABASE_URL, not DATABASE_URL. sslmode=disable
      # because the plugin's Postgres speaks plaintext on the internal docker
      # network. --no-restart: there is no deploy to restart yet.
      if ! dokku postgres:linked "${POSTGRES_SERVICE}" "${APP}" 2>/dev/null; then
        dokku postgres:link "${POSTGRES_SERVICE}" "${APP}" \
          --alias GRITZ_DATABASE_URL \
          --querystring "sslmode=disable" \
          --no-restart
      fi

      # Matches EXPOSE 6464 in the server image.
      dokku ports:set "${APP}" http:80:6464

      touch /var/lib/cloud/gritz-bootstrap-done
      echo "=== gritz bootstrap finished $(date -Is) ==="

runcmd:
  - [/usr/local/sbin/gritz-bootstrap]
