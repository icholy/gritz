[settings]
pin=true

[tools]
node = "25.9.0"
go = "1.26.5"
sops = "3.13.2"
age = "1.3.1"
"npm:pnpm" = "11.11.0"
flyctl = "0.4.74"
dbmate = "2.33.0"
"aqua:siderolabs/conform" = "0.1.0-alpha.31"
"aqua:golangci/golangci-lint" = "2.12.2"

[tasks.build]
description = "Build xagent binaries for all architectures"
depends = ["build:webui"]
run = [
	"CGO_ENABLED=0 go build -o xagent ./cmd/xagent",
	"mkdir -p prebuilt",
	"CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o prebuilt/xagent-linux-amd64 ./cmd/xagent",
	"CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o prebuilt/xagent-linux-arm64 ./cmd/xagent",
]

[tasks."build:webui"]
description = "Build the web UI (skipped if nothing changed)"
sources = [
	"webui/src/**/*",
	"webui/public/**/*",
	"webui/index.html",
	"webui/package.json",
	"webui/pnpm-lock.yaml",
	"webui/vite.config.ts",
	"webui/tsconfig*.json",
	"webui/components.json",
]
outputs = ["internal/server/webui/index.html"]
run = "cd webui && pnpm install --frozen-lockfile && pnpm exec vite build"

[tasks.dev]
description = "Start a local server + runner in Docker"
depends = ["build:webui"]
run = [
	"CGO_ENABLED=0 GOOS=linux go build -o xagent ./cmd/xagent",
	"docker compose -f docker-compose.dev.yml up --build",
]

[tasks."dev:webui"]
description = "Start docker dev server (detached) and the vite dev server"
depends = ["build:webui"]
run = "cd webui && pnpm install --frozen-lockfile && pnpm dev"

[tasks.install]
description = "Build and install xagent bin"
run = [
	"cd webui && pnpm install --frozen-lockfile && pnpm exec vite build",
	"CGO_ENABLED=0 go build -o $(go env GOPATH)/bin/xagent ./cmd/xagent",
]

[tasks.generate]
description = "Generate code from proto files and sqlc"
run = [
	"go generate ./...",
	"cd webui && pnpm install --frozen-lockfile && pnpm run generate",
]

[tasks."up:test"]
description = "Start postgres via docker compose"
run = "docker compose -f docker-compose.test.yml up -d --wait postgres"

[tasks.migrate]
description = "Run database migrations"
env = { DATABASE_URL = "postgres://xagent:xagent@localhost:5433/xagent?sslmode=disable" }
run = "go run ./cmd/migrate"

[tasks.dbmate]
description = "Run dbmate CLI against the local database (for experiments)"
env = { DATABASE_URL = "postgres://xagent:xagent@localhost:5433/xagent?sslmode=disable", DBMATE_MIGRATIONS_DIR = "internal/store/sql/migrations", DBMATE_SCHEMA_FILE = "internal/store/sql/schema.sql" }
run = "dbmate"

[tasks.test]
description = "Run tests"
depends = ["migrate"]
env = { TEST_DATABASE_URL = "postgres://xagent:xagent@localhost:5433/xagent?sslmode=disable" }
run = "go test ./..."

[tasks.lint]
description = "Run golangci-lint"
depends = ["build:webui"]
run = "golangci-lint run"

[tasks.deploy]
description = "Build and deploy to Fly.io"
run = "fly deploy"

# The default sops dotenv output format doesn't handle newlines correctly
# See: https://github.com/getsops/sops/issues/1435
[tasks.env]
description = "Decrypt secrets.yml to .env"
run = "sops --output-type json -d sops.env.yml | jq -r 'to_entries[] | \"\\(.key)=\\(.value | tostring | tojson)\"' > .env"

[tasks.update_secrets]
depends = ["env"]
run = "cat .env | fly secrets import"

[tasks.psql]
description = "Connect to the local database"
run = "psql postgres://xagent:xagent@localhost:5433/xagent?sslmode=disable"

[tasks.logs]
description = "View production logs"
run = "flyctl logs -a xagent"

[tasks.diagrams]
description = "Render d2 diagrams to images/"
run = [
	"d2 images/schema.d2",
	"d2 images/architecture.d2",
]

[tasks.localhost_run]
description = "Use localhost.run to expose the vite proxy to the web"
run = "ssh -R 80:localhost:5173 nokey@localhost.run"

[tasks."install:hooks"]
description = "Install git hooks (commit-msg via conform)"
run = "git config core.hooksPath .githooks"
