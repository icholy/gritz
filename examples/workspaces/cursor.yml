workspaces:
  pets-workshop:
    # secrets: entries become sandbox environment variables just like
    # container.environment ones, and their values are masked out of the log
    # shipped to the server.
    secrets:
      CURSOR_API_KEY: ${env:CURSOR_API_KEY}
    container:
      image: ghcr.io/icholy/gritz-workspace-debian:latest
      working_dir: /root
    commands:
      - git clone https://github.com/github-samples/pets-workshop
    agent:
      type: cursor
      cwd: /root/pets-workshop
      mcp_servers: {}
      prompt: |
        This is an example github repository.
        Don't try opening PRs or issues.
